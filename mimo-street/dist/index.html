<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIMO의 거리</title>
<meta name="description" content="펜으로 그린 작은 상점가. 가게마다 미모의 광고 작품이 하나씩 들어 있습니다.">
<style>
  @font-face{font-family:Pretendard;src:url(fonts/pretendard-subset.woff2) format("woff2");font-weight:100 900;font-display:swap}
  :root{color-scheme:light;--page:#ebe8e2;--text:#1c1c1c;--sub:#5d5850}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--text);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .page{min-height:100svh;display:grid;align-content:center;gap:18px;padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
  .head{width:min(100%,1180px);margin:0 auto;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px}
  .head h1{margin:0;font-size:clamp(22px,3vw,32px);font-weight:900;letter-spacing:-.04em}
  .head p{margin:0;font-size:14px;color:var(--sub)}

  /* the scene is a self-contained card; the page around it never changes colour */
  .card{position:relative;margin:0 auto;width:min(100%,1180px);border-radius:18px;overflow:hidden;isolation:isolate;--ink:#1c1c1c;
        box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 0 0 1px rgba(40,34,26,.10),0 18px 50px -18px rgba(40,34,26,.35),0 4px 14px -6px rgba(40,34,26,.18)}
  /* the street gets longer as works are added; on narrow screens it scrolls sideways */
  .street{container-type:inline-size;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .street svg{display:block;height:clamp(300px,min(70svh,100cqw / var(--ratio,2.4)),560px);width:auto;aspect-ratio:var(--ratio,2.4);max-width:none;user-select:none;-webkit-user-select:none}
  .street svg .pp{fill:var(--paper,#fdfdfc)}
  .street svg .sign{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif}
  .street svg.scrubbing,.street svg.scrubbing *{cursor:grabbing!important}
  .street svg [role=button]:focus-visible{outline:none;stroke:#b3412d;stroke-width:2;stroke-dasharray:4 3}
  .hud{position:absolute;left:16px;top:12px;font-size:14px;line-height:1.3;color:var(--ink);pointer-events:none;opacity:.85}
  .hud b{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .hud span{margin-left:6px;font-size:.92em}
  #hint{position:absolute;left:0;right:0;bottom:10px;margin:0;padding:0 16px;text-align:center;font-size:13px;color:var(--ink);opacity:.8;pointer-events:none;transition:opacity 1.2s}
  #hint.gone{opacity:0}
  #hint .narrow{display:none}
  @media (max-width:700px){#hint .wide{display:none}#hint .narrow{display:inline}}
  .note{width:min(100%,1180px);margin:0 auto;font-size:13px;color:var(--sub)}

  dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none}
  dialog::backdrop{background:rgba(20,18,15,.82)}
  dialog[open]{display:grid;justify-items:center;gap:10px}
  dialog video{height:min(78svh,860px);max-width:92vw;aspect-ratio:9/16;border-radius:14px;background:#000}
  .cap{color:#f4efe6;font-size:15px;text-align:center}
  .cap b{margin-right:8px}
  .cap span{opacity:.75;font-size:13px}
  #p-close{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:50%;border:0;background:#f4efe6;color:#1c1c1c;font-size:22px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
  <script type="module" crossorigin src="./assets/index-D0xCw-07.js"></script>
</head>
<body>
<main class="page">
  <header class="head">
    <h1>MIMO의 거리</h1>
    <p>가게마다 미모가 만든 광고가 하나씩 걸려 있어요.</p>
  </header>
  <div class="card" id="card">
    <div class="street" id="street"></div>
    <div class="hud" id="clock"></div>
    <p id="hint"><span class="wide">해를 끌어 시간을 바꾸고, 가게를 누르면 작품이 재생돼요 · 사람·고양이·참새도 눌러 보세요</span><span class="narrow">해를 끌고, 가게를 눌러 보세요 · 옆으로 밀면 가게가 더 있어요</span></p>
  </div>
  <p class="note">브랜드 작품과 창작 콘셉트를 구분해 소개합니다. 영상 속 행사·프로모션은 제작 당시의 내용입니다.</p>
</main>

<dialog id="player" aria-labelledby="p-title">
  <button id="p-close" aria-label="영상 닫기">×</button>
  <video controls playsinline></video>
  <p class="cap"><b id="p-title"></b><span id="p-meta"></span></p>
</dialog>

</body>
</html>
