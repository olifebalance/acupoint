<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스친 마을</title>
<meta name="description" content="스친들의 가게가 모인 마을. 걸어 다니며 가게에 들르면 주인의 소개를 보고 스레드로 놀러 갈 수 있어요.">
<meta name="theme-color" content="#dce8f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스친 마을">
<style>
  @font-face{font-family:Pretendard;src:url(fonts/pretendard-subset.woff2) format("woff2");font-weight:100 900;font-display:swap}
  :root{color-scheme:light;--ink:#3d4650;--paper:#fffdf6;--hot:#ff7a59;--grass:#e6dcb6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--grass);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow:hidden;overscroll-behavior:none}
  #town{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;font-family:inherit}
  #town .lot{cursor:pointer;outline:none}
  #town .lot:focus-visible>rect:last-child{stroke:var(--hot);stroke-width:5;stroke-dasharray:10 8;rx:14px}
  #me .leg{transform-box:fill-box;transform-origin:50% 0}
  #me.walking .leg.l{animation:leg .36s ease-in-out infinite alternate}
  #me.walking .leg.r{animation:leg .36s ease-in-out infinite alternate-reverse}
  #me.walking .body{animation:bob .18s ease-in-out infinite alternate}
  #me .arm,.peer .arm{transform-box:fill-box;transform-origin:50% 12%}
  .peer .leg{transform-box:fill-box;transform-origin:50% 0}
  .peer.walking .leg.l{animation:leg .36s ease-in-out infinite alternate}
  .peer.walking .leg.r{animation:leg .36s ease-in-out infinite alternate-reverse}
  .waving .arm{animation:wave .42s ease-in-out 4 alternate}
  .hugging .arm{animation:hugarm 1.6s ease-in-out}
  .hugging .body{animation:hugbody 1.6s ease-in-out}
  @keyframes hugarm{0%,100%{transform:rotate(0)}15%,85%{transform:rotate(-115deg)}}
  @keyframes hugbody{0%,100%{translate:0 0}15%,85%{translate:5px -2px}40%{translate:6px -4px}60%{translate:5px -1px}}
  #hug{background:#ffe3ec}
  #install{display:flex;align-items:center;gap:4px;margin:0;padding:4px 4px 4px 6px;border-radius:999px;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  #install[hidden]{display:none}
  #install button{border:0;background:none;font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;padding:6px 8px}
  #install-x{font-size:18px!important;opacity:.6}
  .zombie .zbody{animation:zsway 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes zsway{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
  .zfog ellipse{animation:zfog 3s ease-in-out infinite alternate}
  @keyframes zfog{from{opacity:.25}to{opacity:.55}}
  .confetti circle{animation:conf 1.4s ease-out forwards}
  @keyframes conf{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
  #hug[hidden]{display:none}
  @keyframes wave{from{transform:rotate(-140deg) scale(1.2,1.45)}to{transform:rotate(-215deg) scale(1.2,1.45)}}
  .puff .h{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:puff 1.5s ease-out both}
  @keyframes puff{0%{opacity:0;transform:translateY(16px) scale(.3)}18%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-64px) scale(1.5)}}
  .tw{animation:tw 1.5s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.25}to{opacity:1}}
  #leaves,#snow{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  #leaves[hidden],#snow[hidden]{display:none}
  #town .cap{opacity:var(--snow,0)}
  #snowtag{margin:0;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.92);border:2px solid var(--ink);font-size:13px;font-weight:800}
  #snowtag[hidden]{display:none}
  #toast{margin:0;padding:8px 16px;border-radius:999px;background:#2f3a4f;color:#fff;font-size:14px;font-weight:800}
  #toast[hidden]{display:none}
  #throw{background:#e9f1fb}
  #throw:disabled{opacity:.7;cursor:default}
  #throw[hidden]{display:none}
  #build{background:#fff}
  #build:disabled{opacity:.7;cursor:default}
  #build[hidden]{display:none}
  .sheet .note{margin:10px 0 0;font-size:13px;font-weight:700;opacity:.8}
  .sheet .note[hidden]{display:none}
  .smoke circle{transform-box:fill-box;transform-origin:50% 50%;animation:smoke 3.3s ease-out infinite;opacity:0}
  @keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.85}100%{opacity:0;transform:translate(14px,-70px) scale(1.6)}}
  .hit .body{animation:hit .5s ease-in-out 2}
  @keyframes hit{0%,100%{translate:0 0}25%{translate:-4px 0}75%{translate:4px 0}}
  #snow i{position:absolute;top:-4vh;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.96;border:1.5px solid rgba(96,118,152,.6);animation:snow var(--d) linear var(--w) infinite}
  @keyframes snow{0%{transform:translate(0,0)}50%{transform:translate(var(--x),55vh)}100%{transform:translate(0,110vh)}}
  #leaves i{position:absolute;top:-8vh;width:var(--s,16px);height:calc(var(--s,16px)*.62);background:var(--c);border-radius:80% 12% 80% 12%;opacity:.9;animation:fall var(--d) linear var(--w) infinite}
  @keyframes fall{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(6vw,30vh) rotate(160deg)}50%{transform:translate(-3vw,60vh) rotate(300deg)}75%{transform:translate(7vw,90vh) rotate(470deg)}100%{transform:translate(1vw,120vh) rotate(640deg)}}
  @keyframes leg{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
  @keyframes bob{from{translate:0 0}to{translate:0 -2.5px}}

  .bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
  .bar>*{pointer-events:auto}
  .brand{margin:0 auto 0 0;padding:8px 14px;border-radius:14px;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);line-height:1.2}
  .brand b{display:block;font-size:19px;font-weight:900;letter-spacing:-.03em}
  .brand span{font-size:12px;font-weight:700;opacity:.75}
  .chip{height:44px;padding:0 14px;border-radius:12px;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
  @media (max-width:480px){.chip{height:40px;padding:0 10px;font-size:13px}.brand{padding:6px 10px}.brand b{font-size:16px}.bar{gap:8px}}
  .chip:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .dock{position:fixed;left:0;right:0;bottom:0;display:grid;justify-items:center;gap:10px;padding:0 16px max(18px,env(safe-area-inset-bottom,0px));pointer-events:none}
  .dock>*{pointer-events:auto}
  #visit{height:54px;padding:0 24px;border-radius:16px;background:var(--hot);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font:inherit;font-size:17px;font-weight:900;color:#fff;cursor:pointer}
  #visit[hidden]{display:none}
  .acts{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .chip.tag{display:inline-flex;align-items:center;cursor:default;background:#fff3c4}
  .chip.tag[hidden]{display:none}
  .hearts{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:10px 12px 10px 16px;border-radius:14px;background:#fff0f3;border:2px solid var(--ink)}
  .hearts[hidden]{display:none}
  .hearts b{font-size:15px}
  .hearts button{height:42px;padding:0 16px;border-radius:11px;border:2px solid var(--ink);background:#ff6f91;color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
  .hearts button:disabled{background:#e9e4dc;color:#7a7f86;cursor:default}
  .looks{display:flex;gap:8px}
  .looks label{cursor:pointer}
  .looks input{position:absolute;opacity:0}
  .looks span{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:11px;border:2px solid var(--ink);font-size:15px;font-weight:800}
  .looks input:checked+span{background:var(--ink);color:var(--paper)}
  .looks input:focus-visible+span{outline:3px solid var(--hot);outline-offset:3px}
  #hint{margin:0;padding:8px 14px;border-radius:999px;background:rgba(255,253,246,.92);font-size:13px;font-weight:700;transition:opacity .8s}
  #hint.gone{opacity:0}
  #hint .pc{display:none}
  @media (hover:hover) and (pointer:fine){#hint .pc{display:inline}}
  :focus-visible{outline:3px solid var(--hot);outline-offset:3px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

  dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;color:var(--ink)}
  dialog::backdrop{background:rgba(40,46,36,.45)}
  .sheet{position:relative;width:min(88vw,400px);padding:26px 24px 24px;border-radius:20px;background:var(--paper);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--c,var(--ink))}
  .sheet .addr{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.03em;opacity:.7}
  .sheet h2{margin:0;font-size:27px;font-weight:900;letter-spacing:-.04em;line-height:1.2;padding-right:44px}
  .sheet .handle{margin:4px 0 0;font-size:14px;opacity:.75}
  .sheet .intro{margin:16px 0 0;font-size:16px;line-height:1.65;white-space:pre-line}
  .sheet .go{display:flex;align-items:center;justify-content:center;margin-top:20px;height:52px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:800;text-decoration:none;border:0;width:100%;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
  .sheet .go[hidden]{display:none}
  .x{position:absolute;z-index:2;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
  .sheet label.f{display:block;margin:16px 0 8px;font-size:14px;font-weight:800}
  .sheet input[type=text]{width:100%;height:50px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:inherit;font-size:16px;color:var(--ink)}
  .colors{display:flex;gap:10px;flex-wrap:wrap}
  .colors label{position:relative;cursor:pointer}
  .colors input{position:absolute;opacity:0}
  .colors span{display:block;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink)}
  .colors input:checked+span{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
  .colors input:focus-visible+span{outline:3px solid var(--hot);outline-offset:6px}
  .fine{margin:12px 0 0;font-size:12px;opacity:.7}
  @media (prefers-reduced-motion:reduce){#hint{transition:none}.tw{animation:none}#leaves,#snow{display:none}.smoke circle{animation:none;opacity:.6}.zombie .zbody,.zfog ellipse{animation:none}}
</style>
</head>
<body>
<svg id="town" role="application" aria-label="스친 마을 지도. 집을 누르면 그 집으로 걸어갑니다."></svg>
<div id="leaves" aria-hidden="true"></div>
<div id="snow" aria-hidden="true" hidden></div>

<header class="bar">
  <p class="brand"><b>스친 마을</b><span id="count"></span></p>
  <span class="chip tag" id="online" hidden></span>
  <button class="chip" id="map" aria-pressed="false">전체 보기</button>
  <button class="chip" id="night" aria-pressed="false">밤 보기</button>
  <button class="chip" id="rename" aria-label="닉네임과 옷 색 바꾸기">내 손님</button>
</header>

<div class="dock">
  <p id="install" hidden><button type="button" id="install-go">📲 홈 화면에 마을 추가</button><button type="button" id="install-x" aria-label="닫기">×</button></p>
  <p id="snowtag" hidden>❄ 함박눈이 와요 · 밤 10시까지</p>
  <p id="toast" role="status" hidden></p>
  <div class="acts"><button id="visit" hidden></button><button class="chip" id="wave">손 흔들기</button><button class="chip" id="throw" hidden>눈 던지기</button><button class="chip" id="build" hidden>눈사람 만들기</button><button class="chip" id="hug" hidden>안아주기</button></div>
  <p id="hint">가고 싶은 집을 누르면 걸어가요<span class="pc"> · 방향키로도 움직여요</span></p>
</div>

<dialog id="guide" aria-labelledby="gd-title">
  <div class="sheet">
    <button class="x" id="gd-close" aria-label="닫기">×</button>
    <p class="addr">앱처럼 쓰기</p>
    <h2 id="gd-title">홈 화면에 마을 추가</h2>
    <p class="intro" id="gd-text"></p>
    <a class="go" id="gd-chrome" hidden>크롬으로 열기</a>
  </div>
</dialog>

<dialog id="card" aria-labelledby="c-name">
  <div class="sheet">
    <button class="x" id="c-close" aria-label="닫기">×</button>
    <p class="addr" id="c-addr"></p>
    <h2 id="c-name"></h2>
    <p class="handle" id="c-handle"></p>
    <p class="intro" id="c-intro"></p>
    <div class="hearts" id="c-hearts" hidden><b id="c-heart-n"></b><button type="button" id="c-heart">하트 주기</button></div>
    <p class="note" id="c-note" hidden></p>
    <a class="go" id="c-go" target="_blank" rel="noopener noreferrer"></a>
  </div>
</dialog>

<dialog id="gate" aria-labelledby="g-title">
  <form class="sheet" id="g-form" method="dialog">
    <p class="addr">스친 마을에 오신 걸 환영해요</p>
    <h2 id="g-title">어떤 손님으로 들어갈까요?</h2>
    <label class="f" for="g-name">닉네임</label>
    <input type="text" id="g-name" maxlength="8" placeholder="손님" autocomplete="nickname">
    <p class="f" style="margin:16px 0 8px;font-size:14px;font-weight:800">모습</p>
    <div class="looks"><label><input type="radio" name="look" value="f" checked><span>여자</span></label><label><input type="radio" name="look" value="m"><span>남자</span></label></div>
    <p class="f" style="margin:16px 0 8px;font-size:14px;font-weight:800">옷 색</p>
    <div class="colors" id="g-colors"></div>
    <button class="go" type="submit">마을 들어가기</button>
    <p class="fine">겨울 마을이에요. 걸으면 눈덩이가 모이고, 밤 9시부터 10시에는 함박눈이 내려요.</p>
    <p class="fine">로그인은 없어요. 닉네임과 모습, 출석은 이 기기에만 저장돼요.</p>
    <p class="fine">이 사이트는 Meta, Threads와 관련이 없습니다.</p>
  </form>
</dialog>

<script src="residents.js?v=17"></script>
<script src="houses.js?v=17"></script>
<script src="net.js?v=17"></script>
<script src="town.js?v=17"></script>
</body>
</html>
