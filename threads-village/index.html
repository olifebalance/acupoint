<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스레드 마을</title>
<meta name="description" content="펜으로 그린 스레드 마을. 가게를 누르면 주인의 자기소개를 보고 스레드로 놀러 갈 수 있어요.">
<style>
  @font-face{font-family:Pretendard;src:url(fonts/pretendard-subset.woff2) format("woff2");font-weight:100 900;font-display:swap}
  :root{color-scheme:light;--page:#ebe8e2;--text:#1c1c1c;--sub:#5d5850;--card:#fbf9f4}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--text);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .page{display:grid;gap:18px;padding:36px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  .head,.village,.note{width:min(100%,1180px);margin:0 auto}
  .head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px}
  .head h1{margin:0;font-size:clamp(26px,3.6vw,40px);font-weight:900;letter-spacing:-.04em}
  .head p{margin:0;font-size:15px;color:var(--sub)}
  .head #count{font-weight:700;color:var(--text)}
  .village{display:grid;gap:18px}

  /* each street is a self-contained card; the page around it never changes colour */
  .card{position:relative;border-radius:18px;overflow:hidden;isolation:isolate;--ink:#1c1c1c;
        box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 0 0 1px rgba(40,34,26,.10),0 18px 50px -18px rgba(40,34,26,.35),0 4px 14px -6px rgba(40,34,26,.18)}
  /* a street grows with its lots; on narrow screens it scrolls sideways */
  .street{container-type:inline-size;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .street svg{display:block;height:clamp(300px,min(70svh,100cqw / var(--ratio,2.4)),560px);width:auto;aspect-ratio:var(--ratio,2.4);max-width:none;user-select:none;-webkit-user-select:none}
  .street svg .pp{fill:var(--paper,#fdfdfc)}
  .street svg .sign{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif}
  .street svg.scrubbing,.street svg.scrubbing *{cursor:grabbing!important}
  .street svg [role=button]:focus-visible{outline:none;stroke:#b3412d;stroke-width:2;stroke-dasharray:4 3}
  .hud,.plate{position:absolute;top:12px;margin:0;font-size:14px;line-height:1.3;color:var(--ink);pointer-events:none;opacity:.85}
  .hud{left:16px}
  .hud b{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .hud span{margin-left:6px;font-size:.92em}
  .plate{right:16px;font-weight:800;letter-spacing:.02em}
  #hint{margin:0 auto;font-size:14px;color:var(--sub);transition:opacity 1.2s}
  #hint.gone{opacity:.45}
  .note{font-size:13px;color:var(--sub)}

  dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;color:var(--text)}
  dialog::backdrop{background:rgba(20,18,15,.6)}
  .resident{position:relative;width:min(88vw,400px);padding:26px 24px 24px;border-radius:18px;background:var(--card);border:2px solid #1c1c1c;box-shadow:8px 8px 0 var(--c,#8a8478)}
  .resident .addr{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub)}
  .resident h2{margin:0;font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.15;padding-right:40px}
  .resident .handle{margin:4px 0 0;font-size:14px;color:var(--sub)}
  .resident .intro{margin:16px 0 0;font-size:16px;line-height:1.65;white-space:pre-line}
  .resident a{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;height:52px;border-radius:12px;background:#1c1c1c;color:#fbf9f4;font-weight:800;text-decoration:none}
  .resident a[hidden]{display:none}
  .resident a:focus-visible,.resident button:focus-visible{outline:3px solid #b3412d;outline-offset:3px}
  #c-close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid #1c1c1c;background:var(--card);font-size:20px;line-height:1;cursor:pointer}
  @media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <h1>스레드 마을</h1>
    <p><span id="count"></span></p>
  </header>
  <p class="note" id="hint">가게를 누르면 주인의 소개가 나와요 · 해를 끌면 밤이 돼요 · 사람·고양이·참새도 눌러 보세요</p>
  <div class="village" id="village"></div>
  <p class="note">지금 보이는 가게와 소개는 모두 예시입니다.</p>
</main>

<dialog id="card-dialog" aria-labelledby="c-name">
  <div class="resident">
    <button id="c-close" aria-label="닫기">×</button>
    <p class="addr" id="c-addr"></p>
    <h2 id="c-name"></h2>
    <p class="handle" id="c-handle"></p>
    <p class="intro" id="c-intro"></p>
    <a id="c-go" target="_blank" rel="noopener noreferrer"></a>
  </div>
</dialog>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
